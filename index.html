<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<link rel="shortcut icon" href="favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Ubuntu+Mono:wght@400;700&family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
<title>Timer OSCE</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app phase-reading" id="osce-app">
    <header class="topbar">
        <div class="topbar__row">
            <span class="brand">OSCE Timer</span>
            <span class="appbar__meta" id="rotation">Rotasi 1 / 11</span>
        </div>
    </header>

    <main class="stage">
        <div class="phase" id="phase" aria-live="polite">Siap Memulai</div>
        <div class="timer" id="timer">15:00</div>
        <div class="progress" id="progress" role="progressbar" aria-label="Sisa waktu" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
            <div class="progress__fill" id="progress-fill"></div>
        </div>
        <p class="message" id="message" aria-live="polite">Tekan tombol Mulai</p>
        <div class="dock">
            <button class="btn btn--primary" id="start-btn" onclick="toggleTimer()">Mulai</button>
            <button class="btn btn--danger" onclick="resetTimer()">Reset</button>
            <button class="btn btn--outline" onclick="goFullscreen()">Layar Penuh</button>
            <button class="btn btn--outline" onclick="skipPhase()">Lewati Fase</button>
        </div>
    </main>

    <nav class="stations" aria-label="Navigasi rotasi">
        <button class="rot-btn" aria-pressed="true" aria-label="Rotasi 1" onclick="goRotation(1)">1</button>
        <button class="rot-btn" aria-pressed="false" aria-label="Rotasi 2" onclick="goRotation(2)">2</button>
        <button class="rot-btn" aria-pressed="false" aria-label="Rotasi 3" onclick="goRotation(3)">3</button>
        <button class="rot-btn" aria-pressed="false" aria-label="Rotasi 4" onclick="goRotation(4)">4</button>
        <button class="rot-btn" aria-pressed="false" aria-label="Rotasi 5" onclick="goRotation(5)">5</button>
        <button class="rot-btn" aria-pressed="false" aria-label="Rotasi 6" onclick="goRotation(6)">6</button>
        <span class="freeze-divider" aria-hidden="true">Freeze</span>
        <button class="rot-btn" aria-pressed="false" aria-label="Rotasi 7" onclick="goRotation(7)">7</button>
        <button class="rot-btn" aria-pressed="false" aria-label="Rotasi 8" onclick="goRotation(8)">8</button>
        <button class="rot-btn" aria-pressed="false" aria-label="Rotasi 9" onclick="goRotation(9)">9</button>
        <button class="rot-btn" aria-pressed="false" aria-label="Rotasi 10" onclick="goRotation(10)">10</button>
        <button class="rot-btn" aria-pressed="false" aria-label="Rotasi 11" onclick="goRotation(11)">11</button>
    </nav>

    <footer class="footer">
        © 2026 Copyright ( Ketik di Sini )
    </footer>
</div>
<script src="app.js" defer></script>
</body>
</html>
