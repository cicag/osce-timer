<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<link rel="shortcut icon" href="favicon.png" type="image/png">
<title>Timer OSCE Prodita</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
}

body {
    background: #0f172a;
    color: #fff;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
}

#osce-app {
    min-height: 100dvh;
    width: 100%;
    display: flex;
    flex-direction: column;
    transition: background 500ms ease;
}

#osce-app.reading { background: radial-gradient(1200px 800px at 50% 10%, #1d4ed8, #0f172a); }
#osce-app.exam { background: radial-gradient(1200px 800px at 50% 10%, #15803d, #0f172a); }
#osce-app.warning { background: radial-gradient(1200px 800px at 50% 10%, #dc2626, #0f172a); }
#osce-app.move { background: radial-gradient(1200px 800px at 50% 10%, #ea580c, #0f172a); }
#osce-app.freeze { background: radial-gradient(1200px 800px at 50% 10%, #7c3aed, #0f172a); }

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: clamp(16px, 4vw, 48px);
    gap: clamp(12px, 2.5vw, 24px);
    text-align: center;
}

.header {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.logo {
    font-size: clamp(28px, 8vw, 72px);
    font-weight: 800;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    text-shadow: 0 20px 60px rgba(15, 23, 42, 0.6);
}

.rotation {
    font-size: clamp(16px, 3vw, 24px);
    font-weight: 600;
    opacity: 0.85;
    letter-spacing: 0.08em;
    text-transform: uppercase;
}

.phase {
    font-size: clamp(22px, 6vw, 48px);
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
}

.timer {
    font-size: clamp(84px, 18vw, 200px);
    font-weight: 900;
    line-height: 0.9;
    letter-spacing: -0.04em;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 40px 120px rgba(15, 23, 42, 0.7);
}

.timer.blink {
    animation: blink 900ms infinite;
}

@keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
}

.message {
    min-height: clamp(20px, 3vw, 28px);
    font-size: clamp(14px, 2.6vw, 20px);
    opacity: 0.9;
}

.progress-wrap {
    width: min(1100px, 92vw);
    height: clamp(10px, 2vw, 14px);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.18);
    overflow: hidden;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25), 0 20px 60px rgba(15, 23, 42, 0.45);
    backdrop-filter: blur(4px);
}

.progress {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, rgba(255,255,255,0.9), rgba(226,232,255,0.8));
    transition: width 1000ms linear;
}

.controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: clamp(8px, 1.6vw, 14px);
    width: min(1100px, 92vw);
}

.btn {
    appearance: none;
    border: 1px solid transparent;
    border-radius: 999px;
    padding: clamp(10px, 1.8vw, 14px) clamp(16px, 3vw, 24px);
    font-size: clamp(12px, 1.6vw, 15px);
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #fff;
    background: rgba(15, 23, 42, 0.45);
    border-color: rgba(255, 255, 255, 0.4);
    cursor: pointer;
    transition: all 160ms ease;
    box-shadow: 0 20px 60px rgba(15, 23, 42, 0.4);
    backdrop-filter: blur(6px);
}

.btn:hover:not(:active) {
    transform: translateY(-2px);
    box-shadow: 0 24px 70px rgba(15, 23, 42, 0.45);
}

.btn:active {
    transform: translateY(-1px) scale(0.99);
}

.btn.start { background: linear-gradient(135deg, rgba(34,197,94,0.95), rgba(22,163,74,0.9)); border-color: rgba(187,247,208,0.9); }
.btn.pause { background: linear-gradient(135deg, rgba(245,158,11,0.95), rgba(217,119,6,0.9)); border-color: rgba(254,240,138,0.9); }
.btn.reset { background: linear-gradient(135deg, rgba(239,68,68,0.95), rgba(220,38,38,0.9)); border-color: rgba(254,202,202,0.9); }
.btn.full  { background: linear-gradient(135deg, rgba(59,130,246,0.95), rgba(37,99,235,0.9)); border-color: rgba(191,219,254,0.9); }
.btn.skip  { background: linear-gradient(135deg, rgba(100,116,139,0.95), rgba(71,85,105,0.9)); border-color: rgba(226,232,255,0.8); }

.rotation-bar {
    display: flex;
    flex-wrap: nowrap;
    gap: clamp(6px, 1.2vw, 10px);
    width: min(1100px, 92vw);
    overflow-x: auto;
    padding: 4px;
    margin-top: clamp(6px, 1.6vw, 12px);
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.4) transparent;
}

.rotation-bar::-webkit-scrollbar {
    height: 8px;
}
.rotation-bar::-webkit-scrollbar-track {
    background: transparent;
}
.rotation-bar::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.35);
    border-radius: 999px;
}

.rot-btn {
    flex: 0 0 auto;
    width: clamp(44px, 6vw, 58px);
    height: clamp(44px, 6vw, 58px);
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.4);
    background: rgba(15,23,42,0.4);
    color: rgba(255,255,255,0.9);
    font-weight: 800;
    font-size: clamp(16px, 2.4vw, 22px);
    cursor: pointer;
    transition: all 160ms ease;
    box-shadow: 0 16px 50px rgba(15,23,42,0.4);
    backdrop-filter: blur(6px);
}

.rot-btn:hover:not(.active) {
    transform: translateY(-2px);
}

.rot-btn.active {
    background: linear-gradient(135deg, rgba(255,255,255,0.98), rgba(226,232,255,0.9));
    color: #0f172a;
    border-color: #fff;
    box-shadow: 0 22px 70px rgba(15,23,42,0.55);
}

.footer {
    width: 100%;
    padding: clamp(14px, 2vw, 20px) clamp(16px, 4vw, 32px);
    text-align: center;
    font-size: clamp(11px, 1.4vw, 13px);
    color: rgba(255,255,255,0.85);
    background: radial-gradient(800px 200px at 50% 0%, rgba(255,255,255,0.12), transparent), linear-gradient(180deg, rgba(15,23,42,0.3), rgba(15,23,42,0.6));
    border-top: 1px solid rgba(255,255,255,0.25);
    backdrop-filter: blur(6px);
}

@media (max-width: 640px) {
    .controls {
        gap: 8px;
    }
    .btn {
        flex: 1 1 calc(50% - 8px);
        min-width: 140px;
    }
}
</style>
</head>
<body>
<div id="osce-app" class="reading">
    <main class="main">
        <header class="header">
            <h1 class="logo">OSCE TIMER</h1>
            <div class="rotation" id="rotation">Rotasi 1 / 11</div>
            <div class="phase" id="phase">Siap Memulai</div>
        </header>
        <div class="timer" id="timer">15:00</div>
        <div class="message" id="message">Tekan tombol START</div>
        <div class="progress-wrap">
            <div class="progress" id="progress"></div>
        </div>
        <div class="controls">
            <button class="btn start" id="start-btn" onclick="startTimer()">START</button>
            <button class="btn pause" onclick="pauseTimer()">PAUSE</button>
            <button class="btn reset" onclick="resetTimer()">RESET</button>
            <button class="btn full" onclick="goFullscreen()">FULLSCREEN</button>
            <button class="btn skip" onclick="skipPhase()">LEWATI</button>
        </div>
        <div class="rotation-bar">
            <button class="rot-btn active" onclick="goRotation(1)">1</button>
            <button class="rot-btn" onclick="goRotation(2)">2</button>
            <button class="rot-btn" onclick="goRotation(3)">3</button>
            <button class="rot-btn" onclick="goRotation(4)">4</button>
            <button class="rot-btn" onclick="goRotation(5)">5</button>
            <button class="rot-btn" onclick="goRotation(6)">6</button>
            <button class="rot-btn" onclick="goRotation(7)">7</button>
            <button class="rot-btn" onclick="goRotation(8)">8</button>
            <button class="rot-btn" onclick="goRotation(9)">9</button>
            <button class="rot-btn" onclick="goRotation(10)">10</button>
            <button class="rot-btn" onclick="goRotation(11)">11</button>
        </div>
    </main>
    <footer class="footer">
        <p>© 2026 Copyright Kampus III Prodi Keperawatan Blitar • Inspired from Prodi Keperawatan Lawang Poltekkes Kemenkes Malang</p>
    </footer>
</div>
<script>
const TOTAL_ROTATION = 11;
const ROTATION_TIME = 900;
const FREEZE_TIME = 480;

let rotation = 1;
let remaining = ROTATION_TIME;
let interval = null;
let running = false;
let freezeMode = false;
let isContinued = false;

const timerEl = document.getElementById('timer');
const phaseEl = document.getElementById('phase');
const messageEl = document.getElementById('message');
const rotationEl = document.getElementById('rotation');
const progressEl = document.getElementById('progress');
const appEl = document.getElementById('osce-app');
const startBtnEl = document.getElementById('start-btn');

function speak(text){
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'id-ID';
        utter.rate = 1;
        window.speechSynthesis.speak(utter);
    }
}

function updateDisplay(){
    let minutes = Math.floor(remaining/60);
    let seconds = remaining%60;
    timerEl.textContent = String(minutes).padStart(2,'0') + ':' + String(seconds).padStart(2,'0');
    let total = freezeMode ? FREEZE_TIME : ROTATION_TIME;
    progressEl.style.width = ((remaining/total)*100)+'%';
    updatePhase();
}

function updatePhase(){
    appEl.classList.remove('reading','exam','warning','move','freeze');
    timerEl.classList.remove('blink');
    if(freezeMode){
        phaseEl.textContent = 'FREEZE';
        appEl.classList.add('freeze');
        if(remaining > 420){
            messageEl.textContent = 'Freeze dimulai. Penguji istirahat dan peserta menunggu di depan stase';
        } else if(remaining <= 60){
            messageEl.textContent = 'Penguji dipersilakan kembali ke ruangan';
        } else {
            messageEl.textContent = 'Freeze berlangsung';
        }
        return;
    }
    let elapsed = ROTATION_TIME - remaining;
    if(elapsed < 60){
        phaseEl.textContent = 'MEMBACA SOAL';
        messageEl.textContent = 'Peserta membaca soal';
        appEl.classList.add('reading');
    }
    else if(elapsed < 780){
        phaseEl.textContent = 'PELAKSANAAN UJIAN';
        messageEl.textContent = 'Pelaksanaan ujian berlangsung';
        appEl.classList.add('exam');
    }
    else if(elapsed < 840){
        phaseEl.textContent = 'WARNING';
        messageEl.textContent = 'Waktu tersisa 1 menit';
        appEl.classList.add('warning');
        timerEl.classList.add('blink');
    }
    else{
        phaseEl.textContent = 'PINDAH STASE';
        messageEl.textContent = 'Silakan berpindah stase';
        appEl.classList.add('move');
    }
}

function nextStage(){
    isContinued = false;
    if(freezeMode){
        freezeMode = false;
        rotation++;
        if(rotation > TOTAL_ROTATION){
            finishOSCE();
            return;
        }
        remaining = ROTATION_TIME;
        rotationEl.textContent = 'Rotasi ' + rotation + ' / ' + TOTAL_ROTATION;
        syncRotationButtons();
        speak('Rotasi berikutnya dimulai');
        updateDisplay();
        return;
    }
    if(rotation === 6){
        freezeMode = true;
        remaining = FREEZE_TIME;
        phaseEl.textContent = 'FREEZE';
        speak('Freeze dimulai. Penguji istirahat dan peserta menunggu di depan stase');
        updateDisplay();
        return;
    }
    rotation++;
    if(rotation > TOTAL_ROTATION){
        finishOSCE();
        return;
    }
    rotationEl.textContent = 'Rotasi ' + rotation + ' / ' + TOTAL_ROTATION;
    remaining = ROTATION_TIME;
    syncRotationButtons();
    speak('Rotasi ' + rotation + ' dimulai');
    updateDisplay();
}

function syncRotationButtons() {
    document.querySelectorAll('.rot-btn').forEach(btn => btn.classList.remove('active'));
    if(rotation >= 1 && rotation <= TOTAL_ROTATION){
        document.querySelectorAll('.rot-btn')[rotation - 1].classList.add('active');
    }
}

function finishOSCE(){
    clearInterval(interval);
    running = false;
    isContinued = false;
    startBtnEl.textContent = 'START';
    phaseEl.textContent = 'SELESAI';
    messageEl.textContent = 'OSCE telah selesai';
    timerEl.textContent = '00:00';
    appEl.classList.remove('reading','exam','warning','move','freeze');
    progressEl.style.width = '0%';
    timerEl.classList.remove('blink');
    speak('OSCE telah selesai');
}

function tick(){
    remaining--;
    if(!freezeMode){
        let elapsed = ROTATION_TIME - remaining;
        if(elapsed === 60){ speak('Silakan membaca soal'); }
        if(elapsed === 780){ speak('Waktu tersisa satu menit'); }
        if(elapsed === 840){ speak('Silakan pindah stase berikutnya'); }
    } else {
        if(remaining === 60){ speak('Penguji dipersilakan kembali ke ruangan'); }
    }
    if(remaining <= 0){
        nextStage();
    }
    updateDisplay();
}

function startTimer(){
    if(running) return;
    running = true;
    interval = setInterval(tick, 1000);
    if(!isContinued){
        speak('Peserta dipersilakan membaca soal');
    }
    startBtnEl.textContent = 'PAUSE';
}

function pauseTimer(){
    if(!running) return;
    running = false;
    clearInterval(interval);
    isContinued = true;
    startBtnEl.textContent = 'LANJUTKAN';
}

function resetTimer(){
    clearInterval(interval);
    running = false;
    rotation = 1;
    remaining = ROTATION_TIME;
    freezeMode = false;
    isContinued = false;
    startBtnEl.textContent = 'START';
    rotationEl.textContent = 'Rotasi 1 / 11';
    phaseEl.textContent = 'Siap Memulai';
    messageEl.textContent = 'Tekan tombol START';
    appEl.classList.remove('reading','exam','warning','move','freeze');
    appEl.classList.add('reading');
    syncRotationButtons();
    updateDisplay();
}

function goFullscreen(){
    if(!document.fullscreenElement){
        document.documentElement.requestFullscreen().catch(err=>{});
    } else {
        document.exitFullscreen();
    }
}

function goRotation(rot){
    clearInterval(interval);
    running = false;
    rotation = rot;
    freezeMode = false;
    remaining = ROTATION_TIME;
    isContinued = false;
    startBtnEl.textContent = 'START';
    rotationEl.textContent = 'Rotasi ' + rotation + ' / ' + TOTAL_ROTATION;
    syncRotationButtons();
    phaseEl.textContent = 'MEMBACA SOAL';
    messageEl.textContent = 'Peserta membaca soal';
    appEl.classList.remove('reading','exam','warning','move','freeze');
    appEl.classList.add('reading');
    updateDisplay();
    speak('Rotasi ' + rotation + ' dipilih');
}

function skipPhase(){
    isContinued = false;
    if(freezeMode){
        nextStage();
        return;
    }
    let elapsed = ROTATION_TIME - remaining;
    if(elapsed < 60){
        remaining = 840;
        updateDisplay();
        speak('silakan masuk');
        return;
    }
    if(elapsed < 780){
        remaining = 120;
        updateDisplay();
        speak('Waktu tersisa satu menit');
        return;
    }
    if(elapsed < 840){
        remaining = 60;
        updateDisplay();
        speak('Silakan pindah stase berikutnya');
        return;
    }
    nextStage();
}

updateDisplay();
syncRotationButtons();

document.addEventListener('contextmenu', e=>e.preventDefault());
document.addEventListener('selectstart', e=>e.preventDefault());
document.addEventListener('dragstart', e=>e.preventDefault());
document.addEventListener('keydown', function(e){
    if(e.key==='F12'||(e.ctrlKey&&e.shiftKey&&(e.key==='I'||e.key==='J'))||(e.ctrlKey&&(e.key==='u'||e.key==='s'||e.key==='c'))){
        e.preventDefault();
    }
});
</script>
</body>
</html>
