<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<link rel="shortcut icon" href="favicon.png" type="image/png">
<title>Timer OSCE Prodita</title>
<style>
/* ===================================================
   STRATEGI LAYER FIX - ADAPTASI KLAS REFERENSI SUKSES ANDA
   =================================================== */
.rakbuku-full-screen {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    width: 100vw !important;
    height: 100vh !important;
    background: #0f172a !important; /* Latar belakang standar gelap ruang ujian */
    z-index: 9999999999 !important; /* Sesuai dengan spesifikasi layer terdepan Anda */
    overflow-y: auto !important;
    padding: 40px;
    box-sizing: border-box;
    transition: background 0.5s ease !important;
    
    /* Penataan Konten Tengah */
    display: flex !important;
    flex-direction: column !important;
    justify-content: center !important;
    align-items: center !important;
    
    /* Proteksi seleksi teks */
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
}

.rakbuku-full-screen * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Arial, sans-serif;
}

/* KONTAINER UTAMA TIMER */
.rakbuku-full-screen .container {
    width: 95%;
    max-width: 1200px;
    text-align: center;
}

/* Memaksa seluruh elemen teks berwarna putih solid agar menang kontras dari CSS CMS */
.rakbuku-full-screen h1 {
    font-size: 4rem;
    margin-bottom: 20px;
    color: #ffffff !important;
    text-shadow: 0 4px 10px rgba(0,0,0,0.5);
}

.rakbuku-full-screen .rotation {
    font-size: 2rem;
    margin-bottom: 15px;
    color: #ffffff !important;
}

.rakbuku-full-screen .phase {
    font-size: 3rem;
    font-weight: bold;
    margin-bottom: 25px;
    color: #ffffff !important;
    text-shadow: 0 2px 8px rgba(0,0,0,0.4);
}

.rakbuku-full-screen .timer {
    font-size: 10rem;
    font-weight: bold;
    margin-bottom: 25px;
    color: #ffffff !important;
    text-shadow: 0 4px 20px rgba(0,0,0,0.6);
    line-height: 1;
}

.rakbuku-full-screen .message {
    font-size: 2rem;
    min-height: 70px;
    margin-bottom: 25px;
    color: #ffffff !important;
}

.rakbuku-full-screen .progress-container {
    width: 100%;
    height: 40px;
    background: #1e293b !important;
    border-radius: 50px;
    overflow: hidden;
    margin-bottom: 30px;
    border: 2px solid rgba(255, 255, 255, 0.1);
}

.rakbuku-full-screen .progress {
    height: 100%;
    width: 100%;
    background: #22c55e !important;
    transition: width 1s linear;
}

.rakbuku-full-screen .controls {
    display: flex;
    gap: 15px;
    justify-content: center;
    flex-wrap: wrap;
}

/* STYLING BUTTONS KONTROL */
.rakbuku-full-screen button {
    padding: 15px 30px;
    border: none !important;
    border-radius: 10px;
    cursor: pointer;
    font-size: 1.1rem;
    font-weight: bold;
    color: #ffffff !important;
    box-shadow: 0 4px 6px rgba(0,0,0,0.2);
}

.rakbuku-full-screen .start { background: #22c55e !important; }
.rakbuku-full-screen .pause { background: #f59e0b !important; }
.rakbuku-full-screen .reset { background: #ef4444 !important; }
.rakbuku-full-screen .full { background: #3b82f6 !important; }
.rakbuku-full-screen .skip { background: #64748b !important; }

/* WARNA LATAR BELAKANG DINAMIS DI LEVEL KONTAINER REFERENSI */ 
.rakbuku-full-screen.reading { background: #2563eb !important; }
.rakbuku-full-screen.exam { background: #16a34a !important; }
.rakbuku-full-screen.warning { background: #dc2626 !important; }
.rakbuku-full-screen.move { background: #ea580c !important; }
.rakbuku-full-screen.freeze { background: #7c3aed !important; }

.rakbuku-full-screen .blink {
    animation: blink-animation 1s infinite;
}

@keyframes blink-animation {
    50% { opacity: .3; }
}

/* STYLING WRAPPER PANEL ROTASI BAWAH */
.rakbuku-full-screen .rotation-wrapper {
    margin-top: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    flex-wrap: nowrap;
    overflow-x: auto;
    padding-bottom: 10px;
    border-top: 3px solid rgba(255, 255, 255, .3);
    padding-top: 15px;
    width: 100%;
}

.rakbuku-full-screen .rotation-wrapper::-webkit-scrollbar {
    height: 6px;
}

.rakbuku-full-screen .rotation-btn {
    min-width: 60px;
    width: 60px;
    height: 60px;
    flex-shrink: 0;
    border: none !important;
    border-radius: 18px;
    background: #e5e7eb !important;
    color: #64748b !important;
    font-size: 24px;
    font-weight: 700;
    cursor: pointer;
    transition: all .3s ease;
}

.rakbuku-full-screen .rotation-btn:hover {
    transform: translateY(-2px);
}

.rakbuku-full-screen .rotation-btn.active {
    background: #0f172a !important;
    color: white !important;
    box-shadow: 0 0 0 3px rgba(148,163,184,.4), 0 8px 20px rgba(0,0,0,.3) !important;
}

/* ===================================================
   SEKSI BLOK FOOTER MANDIRI (PERBAIKAN JARAK & BACKGROUND)
   =================================================== */
.rakbuku-full-screen .osce-separate-footer {
    width: 100% !important;
    background: #00975d !important; /* <--- Silakan ganti warna background footer di sini jika ingin warna lain */
    padding: 25px 30px 45px 30px !important; /* Jarak atas-bawah ditambah agar longgar dan menutup area biru bawah */
    text-align: center !important;
    border-top: 3px solid #b2d235 !important; /* Ketebalan garis hijau disesuaikan agar lebih tegas */
    flex-shrink: 0; 
    margin-top: 30px !important; /* Memberikan ruang/jarak dari tombol rotasi di atasnya agar tidak mepet */
}

.rakbuku-full-screen .osce-separate-footer p {
    color: rgb(252, 250, 250) !important; /* Warna teks dibuat sedikit lebih terang agar mudah dibaca */
    font-size: 0.95rem;
    font-weight: 500;
    letter-spacing: 0.5px;
    line-height: 1.4;
}

/* RESPONSIVE RESOLUTION */
@media(max-width:900px){
    .rakbuku-full-screen h1 { font-size: 2.5rem; }
    .rakbuku-full-screen .timer { font-size: 5rem; }
    .rakbuku-full-screen .phase { font-size: 1.8rem; }
    .rakbuku-full-screen .osce-separate-footer { padding: 12px 20px !important; }
    .rakbuku-full-screen .osce-separate-footer p { font-size: 0.8rem; }
}
</style>
</head>
<body>
<div class="rakbuku-full-screen" id="osce-app-layer">

    <div class="container">

        <h1>OSCE TIMER</h1>

        <div class="rotation" id="rotation">Rotasi 1 / 11</div>

        <div class="phase" id="phase">Siap Memulai</div>

        <div class="timer" id="timer">15:00</div>

        <div class="message" id="message">Tekan tombol START</div>

        <div class="progress-container">
            <div class="progress" id="progress"></div>
        </div>

        <div class="controls">
            <button class="start" id="start-btn" onclick="startTimer()">START</button>
            <button class="pause" onclick="pauseTimer()">PAUSE</button>
            <button class="reset" onclick="resetTimer()">RESET</button>
            <button class="full" onclick="goFullscreen()">FULLSCREEN</button>
            <button class="skip" onclick="skipPhase()">LEWATI</button>
        </div>

        <div class="rotation-wrapper">
            <button class="rotation-btn active" onclick="goRotation(1)">1</button>
            <button class="rotation-btn" onclick="goRotation(2)">2</button>
            <button class="rotation-btn" onclick="goRotation(3)">3</button>
            <button class="rotation-btn" onclick="goRotation(4)">4</button>
            <button class="rotation-btn" onclick="goRotation(5)">5</button>
            <button class="rotation-btn" onclick="goRotation(6)">6</button>
            <button class="rotation-btn" onclick="goRotation(7)">7</button>
            <button class="rotation-btn" onclick="goRotation(8)">8</button>
            <button class="rotation-btn" onclick="goRotation(9)">9</button>
            <button class="rotation-btn" onclick="goRotation(10)">10</button>
            <button class="rotation-btn" onclick="goRotation(11)">11</button>
        </div>

        
    </div>

<!-- AREA BAWAH: BLOK FOOTER MANDIRI DENGAN WARNA BACKGROUND SENDIRI -->
    <div class="osce-separate-footer">
        <p>© 2026 Copyright Kampus III Prodi Keperawatan Blitar • Inspired from Prodi Keperawatan Lawang Poltekkes Kemenkes Malang</p>
    </div>

</div>
<script>
const TOTAL_ROTATION = 11;
const ROTATION_TIME = 900; 
const FREEZE_TIME = 480; 

let rotation = 1;
let remaining = ROTATION_TIME;
let interval = null;
let running = false;
let freezeMode = false;
let isContinued = false; // Penanda khusus status "Lanjutkan"

const timerEl = document.getElementById('timer');
const phaseEl = document.getElementById('phase');
const messageEl = document.getElementById('message');
const rotationEl = document.getElementById('rotation');
const progressEl = document.getElementById('progress');
const appLayer = document.getElementById('osce-app-layer');
const startBtnEl = document.getElementById('start-btn');

function speak(text){
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'id-ID';
        utter.rate = 1;
        window.speechSynthesis.speak(utter);
    }
}

function updateDisplay(){
    let minutes = Math.floor(remaining/60);
    let seconds = remaining%60;

    timerEl.innerHTML = String(minutes).padStart(2,'0') + ':' + String(seconds).padStart(2,'0');

    let total = freezeMode ? FREEZE_TIME : ROTATION_TIME;
    progressEl.style.width = ((remaining/total)*100)+'%';

    updatePhase();
}

function updatePhase(){
    appLayer.className = 'rakbuku-full-screen';
    timerEl.classList.remove('blink');

    if(freezeMode){
        phaseEl.innerHTML = "FREEZE";
        appLayer.classList.add('freeze');

        if(remaining > 420){
            messageEl.innerHTML = "Freeze dimulai. Penguji istirahat dan peserta menunggu di depan stase";
        } else if(remaining <= 60){
            messageEl.innerHTML = "Penguji dipersilakan kembali ke ruangan";
        } else {
            messageEl.innerHTML = "Freeze berlangsung";
        }
        return;
    }

    let elapsed = ROTATION_TIME - remaining;

    if(elapsed < 60){
        phaseEl.innerHTML = "MEMBACA SOAL";
        messageEl.innerHTML = "Peserta membaca soal";
        appLayer.classList.add('reading');
    }
    else if(elapsed < 780){
        phaseEl.innerHTML = "PELAKSANAAN UJIAN";
        messageEl.innerHTML = "Pelaksanaan ujian berlangsung";
        appLayer.classList.add('exam');
    }
    else if(elapsed < 840){
        phaseEl.innerHTML = "WARNING";
        messageEl.innerHTML = "Waktu tersisa 1 menit";
        appLayer.classList.add('warning');
        timerEl.classList.add('blink');
    }
    else{
        phaseEl.innerHTML = "PINDAH STASE";
        messageEl.innerHTML = "Silakan berpindah stase";
        appLayer.classList.add('move');
    }
}

function nextStage(){
    isContinued = false; // Reset status karena berpindah stase/rotasi baru utuh
    
    if(freezeMode){
        freezeMode = false;
        rotation++;

        if(rotation > TOTAL_ROTATION){
            finishOSCE();
            return;
        }

        remaining = ROTATION_TIME;
        rotationEl.innerHTML = "Rotasi " + rotation + " / " + TOTAL_ROTATION;
        syncRotationButtons();
        speak("Rotasi berikutnya dimulai");
        return;
    }

    if(rotation === 6){
        freezeMode = true;
        remaining = FREEZE_TIME;
        phaseEl.innerHTML = "FREEZE";
        speak("Freeze dimulai. Penguji istirahat dan peserta menunggu di depan stase");
        return;
    }

    rotation++;

    if(rotation > TOTAL_ROTATION){
        finishOSCE();
        return;
    }

    rotationEl.innerHTML = "Rotasi " + rotation + " / " + TOTAL_ROTATION;
    remaining = ROTATION_TIME;
    syncRotationButtons();
    speak("Rotasi " + rotation + " dimulai");
}

function syncRotationButtons() {
    document.querySelectorAll('#osce-app-layer .rotation-btn').forEach(btn => btn.classList.remove('active'));
    if(rotation <= TOTAL_ROTATION){
        document.querySelectorAll('#osce-app-layer .rotation-btn')[rotation - 1].classList.add('active');
    }
}

function finishOSCE(){
    clearInterval(interval);
    running = false;
    isContinued = false;
    startBtnEl.innerHTML = "START"; 
    phaseEl.innerHTML = "SELESAI";
    messageEl.innerHTML = "OSCE telah selesai";
    timerEl.innerHTML = "00:00";
    speak("OSCE telah selesai");
}

function tick(){
    remaining--;

    if(!freezeMode){
        let elapsed = ROTATION_TIME - remaining;

        if(elapsed === 60){ speak("Silakan membaca soal"); }
        if(elapsed === 780){ speak("Waktu tersisa satu menit"); }
        if(elapsed === 840){ speak("Silakan pindah stase berikutnya"); }
    }
    else{
        if(remaining === 60){ speak("Penguji dipersilakan kembali ke ruangan"); }
    }

    if(remaining <= 0){
        nextStage();
    }

    updateDisplay();
}

function startTimer(){
    if(running) return;
    running = true;
    interval = setInterval(tick, 1000);

    /* KONDISI FILTER SUARA */
    if (!isContinued) {
        // Hanya berbunyi jika ini start murni awal rotasi (bukan lanjutan pause)
        speak("Peserta dipersilakan membaca soal");
    }
    
    startBtnEl.innerHTML = "START"; 
}

function pauseTimer(){
    if(!running) return; 
    running = false;
    clearInterval(interval);
    isContinued = true; // Kunci status: klik start berikutnya adalah "Lanjutkan"
    startBtnEl.innerHTML = "LANJUTKAN"; 
}

function resetTimer(){
    clearInterval(interval);
    running = false;
    rotation = 1;
    remaining = ROTATION_TIME;
    freezeMode = false;
    isContinued = false; // Reset detektor status

    startBtnEl.innerHTML = "START"; 
    rotationEl.innerHTML = "Rotasi 1 / 11";
    phaseEl.innerHTML = "Siap Memulai";
    messageEl.innerHTML = "Tekan tombol START";
    
    syncRotationButtons();
    updateDisplay();
}

function goFullscreen(){
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {});
    } else {
        document.exitFullscreen();
    }
}

function goRotation(rot){
    clearInterval(interval);
    running = false;
    rotation = rot;
    freezeMode = false;
    remaining = ROTATION_TIME;
    isContinued = false; // Reset karena pindah stase manual berarti stase baru

    startBtnEl.innerHTML = "START"; 
    rotationEl.innerHTML = "Rotasi " + rotation + " / " + TOTAL_ROTATION;
    syncRotationButtons();

    phaseEl.innerHTML = "MEMBACA SOAL";
    messageEl.innerHTML = "Peserta membaca soal";

    updateDisplay();
    speak("Rotasi " + rotation + " dipilih");
}

function skipPhase(){
    isContinued = false; // Reset flag saat melompati fase secara manual
    if(freezeMode){
        nextStage();
        return;
    }

    let elapsed = ROTATION_TIME - remaining;

    if(elapsed < 60){
        remaining = 840;
        updateDisplay();
        speak("silakan masuk");
        return;
    }
    if(elapsed < 780){
        remaining = 120;
        updateDisplay();
        speak("Waktu tersisa satu menit");
        return;
    }
    if(elapsed < 840){
        remaining = 60;
        updateDisplay();
        speak("Silakan pindah stase berikutnya");
        return;
    }
    nextStage();
}

updateDisplay();

/* Proteksi Keamanan Sistem */
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('selectstart', e => e.preventDefault());
document.addEventListener('dragstart', e => e.preventDefault());
document.addEventListener('keydown', function(e){
    if(e.key === "F12" || 
       (e.ctrlKey && e.shiftKey && (e.key === "I" || e.key === "J")) || 
       (e.ctrlKey && (e.key === "u" || e.key === "s" || e.key === "c"))){
        e.preventDefault();
    }
});
</script>
</body>
</html>
